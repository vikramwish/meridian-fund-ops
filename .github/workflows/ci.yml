name: Meridian CI Pipeline

on:
  push:
    branches: [main, 'autopilot/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck and Build
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Secret Scan Guardrail
        run: |
          echo "Scanning for accidental secrets or API keys..."
          ! git grep -E -i "sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z-_]{35}" -- ':!package-lock.json' ':!*.log'
